<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popeye's Arm Wrestling Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8d4a4; --panel:#ffc77c; --panel2:#ffe3b8; --line:#e0a35a;
    --text:#3a2410; --muted:#7a5530; --accent:#e07b00; --good:#1f9d63; --bad:#c81e32;
    --gold:#f2b01e; --sailor:#ffe7a0; --popeye:#ff9a3c; --spinach:#6bb84d;
    --display:'Luckiest Guy','Chalkboard SE','Comic Sans MS',Impact,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .app{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:16px;padding:16px;min-height:100vh}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:18px;align-self:start}
  h1{margin:0;font-family:var(--display);font-size:36px;line-height:1.1;letter-spacing:1.5px;font-weight:400;
     -webkit-text-stroke:5px var(--gold);paint-order:stroke fill;text-shadow:3px 3px 0 #7a3b00}
  h1 .pop{color:#d91e2a} h1 .chl{color:var(--gold)}
  .subtitle{margin:2px 0 0;color:var(--muted);font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
  .box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .field{display:flex;align-items:center;background:#fff3df;border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-top:8px}
  .field:focus-within{border-color:var(--accent)}
  .field input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:18px;font-weight:700;padding:12px 0;width:100%}
  .chips{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .lvl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-weight:700;cursor:pointer;
    border:2px solid rgba(90,52,18,.55);border-radius:12px;padding:10px 12px;color:#2a1400;background:#fff3df;opacity:.72;transition:.15s}
  .lvl .tick{width:22px;height:22px;border-radius:50%;border:2px solid rgba(90,52,18,.55);display:grid;place-items:center;font-size:14px;background:#fff}
  .lvl[aria-pressed=true]{opacity:1;box-shadow:0 3px 0 rgba(90,52,18,.4)}
  .lvl[aria-pressed=true] .tick{background:#2a1400;color:#fff;border-color:#2a1400}
  .lvl[aria-pressed=true] .tick::before{content:"\2713"}
  .l1[aria-pressed=true]{background:var(--sailor)} .l2[aria-pressed=true]{background:var(--popeye)} .l3[aria-pressed=true]{background:var(--spinach)}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 16px;font-weight:700;color:#1a1200}
  .btn-main{background:linear-gradient(180deg,#ffc94d,#ffa000);font-size:17px;box-shadow:0 6px 18px rgba(255,160,0,.3)}
  .btn-main:hover:not(:disabled){filter:brightness(1.08)} .btn-main:active:not(:disabled){transform:translateY(1px)}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line);padding:10px 12px;font-weight:600}
  .btn-ghost:hover{background:var(--panel2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .msg{min-height:18px;font-size:13px;color:var(--muted);margin-top:8px}
  .msg.err{color:var(--bad)}
  .draw-name{font-family:var(--display);font-size:30px;line-height:1.1;text-align:center;min-height:68px;display:grid;place-items:center;
    margin:10px 0 12px;padding:8px;border-radius:12px;background:#fff3df;border:2px dashed var(--line);word-break:break-word;color:#5a2a00}
  .draw-name.win{background:linear-gradient(180deg,#fff08a,#ffd028 55%,#f0a410);border:2px solid #a86b00;color:#3a1c00;
    animation:glow 1.1s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 8px rgba(255,208,40,.6)}50%{box-shadow:0 0 22px rgba(255,208,40,1)}}

  /* sea + ship board */
  .sea{border:1px solid var(--line);border-radius:16px;padding:34px 28px;overflow:hidden;position:relative;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='34'><path d='M0 17 Q20 9 40 17 T80 17 T120 17 T160 17' fill='none' stroke='white' stroke-opacity='.18' stroke-width='2'/></svg>") 0 0/160px 34px repeat,
      linear-gradient(180deg,#3fa6cf,#1d6a96);
    animation:sea 14s linear infinite}
  @keyframes sea{to{background-position:160px 0,0 0}}
  .ship{max-width:860px;margin:0 auto;animation:roll 7s ease-in-out infinite;transform-origin:50% 60%}
  @keyframes roll{0%,100%{transform:rotate(-.5deg) translateY(0)}50%{transform:rotate(.5deg) translateY(3px)}}
  .hull{background:repeating-linear-gradient(180deg,#b9824a 0 44px,#7a4a22 44px 46px);border:12px solid #5a3412;border-radius:70px 70px 36px 36px / 90px 90px 36px 36px;
    box-shadow:0 0 0 6px rgba(255,255,255,.3),0 0 0 14px rgba(255,255,255,.18),inset 0 0 0 3px rgba(255,214,150,.45);padding:34px 28px 28px}
  .board-head{text-align:center;margin-bottom:14px}
  .board-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:1px;color:var(--gold);
    -webkit-text-stroke:4px #5a2a00;paint-order:stroke fill}
  .anchor{display:block;margin:0 auto 6px;width:46px;height:46px}
  .table{container-type:inline-size;background:rgba(255,236,200,.93);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);margin-top:12px;
    background:rgba(255,236,200,.9);border-radius:10px;padding:8px 12px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid rgba(90,52,18,.6);vertical-align:-1px;margin-right:5px}
  .row{display:grid;grid-template-columns:44px 1fr auto 60px auto;gap:10px;align-items:center;background:#fff3df;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
  .rank{font-family:var(--display);font-size:22px;text-align:center;color:#7a4a22}
  .nm{font-weight:800;font-size:17px;word-break:break-word}
  .tag{display:inline-block;margin-left:8px;font-size:10px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:20px;background:#2a1400;color:#ffd028;vertical-align:2px}
  .lvls{display:flex;gap:6px}
  .pill{font:inherit;font-size:12px;font-weight:800;padding:6px 9px;border-radius:9px;border:1.5px solid rgba(90,52,18,.5);color:#5b4a36;background:#e6d6bd;opacity:.6;cursor:pointer}
  .pill[aria-pressed=true]{opacity:1;color:#2a1400}
  .pill.l1[aria-pressed=true]{background:var(--sailor)} .pill.l2[aria-pressed=true]{background:var(--popeye)} .pill.l3[aria-pressed=true]{background:var(--spinach)}
  .count{text-align:center;font-weight:800;font-size:14px;color:var(--muted)}
  .del{padding:6px 10px;background:#fff;border:1.5px solid #e3a3a8;color:var(--bad);font-size:13px;font-weight:800;line-height:1;border-radius:9px}
  .del:hover{background:var(--bad);border-color:var(--bad);color:#fff}
  .row.champ{background:linear-gradient(180deg,#fff08a,#ffd028 55%,#f0a410);border:2px solid #a86b00;box-shadow:0 0 12px rgba(255,208,40,.75)}
  .row.champ .rank{color:#5a2a00}
  .row.champ .count{color:#3a1c00}
  .row.flash{animation:flash .5s ease-in-out 6}
  @keyframes flash{50%{transform:scale(1.025);box-shadow:0 0 26px rgba(255,208,40,1)}}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-weight:600}
  .sec{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:800;padding:2px 4px}
  /* narrow scoreboard: stack each row in two lines (the board stays beside the form) */
  @container (max-width:560px){
    .row{grid-template-columns:34px 1fr auto;grid-template-areas:"r n d" "l l l" "c c c"}
    .row .rank{grid-area:r}.row .nmwrap{grid-area:n}.row .lvls{grid-area:l;flex-wrap:wrap}.row .count{grid-area:c;text-align:left}.row .del{grid-area:d}
  }
  @media (max-width:640px){
    .app{grid-template-columns:1fr}
  }
  @media (max-width:900px){
    .sea{padding:22px 12px}.hull{padding:26px 12px 18px;border-width:9px}
  }
  @media (prefers-reduced-motion:reduce){.sea,.ship,.draw-name.win,.row.flash{animation:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div>
      <h1><span class="pop">Popeye's</span> <span class="chl">Arm Wrestling</span></h1>
      <p class="subtitle">Challenge · Beat all 3 levels to join the champions</p>
    </div>

    <form class="box" id="addForm" autocomplete="off">
      <span class="lbl">New challenger</span>
      <div class="field"><input id="name" type="text" maxlength="24" placeholder="Name" aria-label="Challenger name"></div>
      <div class="lbl" style="margin-top:14px">Levels beaten</div>
      <div class="chips" id="pickChips"></div>
      <div class="msg" id="msg" role="status"></div>
      <button type="submit" class="btn-main" style="width:100%;margin-top:6px">Add to scoreboard</button>
    </form>

    <div class="box">
      <div class="lbl">Random champion draw</div>
      <div class="draw-name" id="drawName" aria-live="polite">—</div>
      <button class="btn-main" id="drawBtn" style="width:100%">Pick a random champion</button>
      <div class="msg" id="drawMsg"></div>
    </div>

    <button class="btn-ghost" id="clearAll">Reset scoreboard</button>
  </aside>

  <main class="sea">
    <div class="ship">
      <div class="hull">
        <div class="board-head">
          <svg class="anchor" viewBox="-20 -20 40 40" aria-hidden="true">
            <circle r="18" fill="#fff3df" stroke="#c81e32" stroke-width="3"/>
            <circle r="14.5" fill="none" stroke="#f2b01e" stroke-width="1.5"/>
            <g fill="none" stroke="#1b3a6e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="0" cy="-10.5" r="2.6"/><path d="M-5 -6H5M0 -8V9"/>
              <path d="M-8.5 2.9A9 9 0 0 0 8.5 2.9"/>
            </g>
            <g fill="#1b3a6e"><path d="M-11.7 -.7L-7.3 3.7-9.7 5.4z"/><path d="M11.7 -.7L7.3 3.7 9.7 5.4z"/></g>
          </svg>
          <h2>Scoreboard</h2>
        </div>
        <div class="table" id="table"></div>
        <div class="legend">
          <span><i style="background:var(--sailor)"></i>Sailor</span>
          <span><i style="background:var(--popeye)"></i>Popeye</span>
          <span><i style="background:var(--spinach)"></i>Spinach Popeye</span>
          <span><i style="background:linear-gradient(180deg,#fff08a,#f0a410)"></i>Champion (all 3)</span>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const LEVELS = [
    {name: "Sailor", cls: "l1"},
    {name: "Popeye", cls: "l2"},
    {name: "Spinach Popeye", cls: "l3"}
  ];
  const KEY = "popeye-arm-wrestling-v1";
  const $ = id => document.getElementById(id);
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  let players = load();
  let picked = [false, false, false];
  let flashId = null, drawing = false;

  function load() {
    try { const v = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(v)) return v; } catch (_) {}
    return [];
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(players)); } catch (_) {} }
  const count = p => p.levels.filter(Boolean).length;
  const isChamp = p => count(p) === LEVELS.length;
  const champs = () => players.filter(isChamp);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function el(tag, props = {}, ...kids) {
    const e = document.createElement(tag);
    Object.assign(e, props);
    kids.flat().forEach(k => e.append(k));
    return e;
  }

  // ----- add form -----
  function renderPick() {
    const box = $("pickChips"); box.innerHTML = "";
    LEVELS.forEach((l, i) => {
      const b = el("button", {type: "button", className: "lvl " + l.cls}, el("span", {className: "tick"}), l.name);
      b.setAttribute("aria-pressed", picked[i]);
      b.addEventListener("click", () => { picked[i] = !picked[i]; renderPick(); });
      box.append(b);
    });
  }
  function say(text, err) { const m = $("msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); }

  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("name").value.trim().replace(/\s+/g, " ");
    if (!name) { say("Enter a name first.", true); $("name").focus(); return; }
    const existing = players.find(p => p.name.toLowerCase() === name.toLowerCase());
    if (existing) {
      existing.levels = existing.levels.map((v, i) => v || picked[i]);
      existing.ts = Date.now(); flashId = existing.id;
      say(`${existing.name} already on the board — levels updated.`);
    } else {
      const p = {id: uid(), name, levels: picked.slice(), ts: Date.now()};
      players.push(p); flashId = p.id;
      say(isChamp(p) ? `${name} beat all 3 — welcome, champion!` : `${name} added.`);
    }
    save(); $("name").value = ""; picked = [false, false, false]; renderPick(); render();
  });

  // ----- scoreboard -----
  function sorted() {
    return players.slice().sort((a, b) => count(b) - count(a) || a.ts - b.ts);
  }
  function render() {
    const t = $("table"); t.innerHTML = "";
    const list = sorted();
    if (!list.length) { t.append(el("div", {className: "empty"}, "No challengers yet — add the first sailor!")); }
    let prevChamp = null;
    list.forEach((p, idx) => {
      const champ = isChamp(p);
      if (idx === 0 && champ) t.append(el("div", {className: "sec"}, "Champions · beat all 3 levels"));
      if (prevChamp === true && !champ) t.append(el("div", {className: "sec"}, "Challengers"));
      prevChamp = champ;

      const pills = el("div", {className: "lvls"});
      LEVELS.forEach((l, i) => {
        const b = el("button", {type: "button", className: "pill " + l.cls, title: `Toggle: ${l.name}`}, l.name);
        b.setAttribute("aria-pressed", p.levels[i]);
        b.addEventListener("click", () => { p.levels[i] = !p.levels[i]; p.ts = Date.now(); flashId = isChamp(p) ? p.id : null; save(); render(); });
        pills.append(b);
      });
      const nm = el("div", {className: "nmwrap"}, el("span", {className: "nm"}, p.name));
      if (champ) nm.append(el("span", {className: "tag"}, "CHAMPION"));
      const del = el("button", {type: "button", className: "del", title: `Delete ${p.name}`}, "✖ Delete");
      del.setAttribute("aria-label", `Delete ${p.name} from the scoreboard`);
      del.addEventListener("click", () => { players = players.filter(x => x !== p); save(); render(); });

      const row = el("div", {className: "row" + (champ ? " champ" : "") + (p.id === flashId ? " flash" : "")},
        el("div", {className: "rank"}, champ ? "★" : String(idx + 1)),
        nm, pills,
        el("div", {className: "count"}, `${count(p)} / ${LEVELS.length}`),
        del);
      row.dataset.id = p.id;
      t.append(row);
    });
    $("drawBtn").disabled = drawing || champs().length === 0;
    $("drawMsg").textContent = champs().length ? `${champs().length} champion${champs().length > 1 ? "s" : ""} in the draw.` : "Needs at least one champion (all 3 levels beaten).";
  }

  // ----- random champion draw -----
  $("drawBtn").addEventListener("click", () => {
    const pool = champs(); if (!pool.length || drawing) return;
    drawing = true; $("drawBtn").disabled = true; flashId = null;
    const out = $("drawName"); out.classList.remove("win");
    const winner = pool[Math.floor(Math.random() * pool.length)];
    const steps = reduceMotion ? 1 : 22 + Math.floor(Math.random() * 6);
    let i = 0, last = null;
    const tick = () => {
      i++;
      if (i >= steps) {
        out.textContent = winner.name; out.classList.add("win");
        drawing = false; flashId = winner.id; render();
        const row = document.querySelector(`.row[data-id="${winner.id}"]`);
        if (row) row.scrollIntoView({block: "nearest", behavior: reduceMotion ? "auto" : "smooth"});
        return;
      }
      let n; do { n = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && n === last);
      last = n; out.textContent = n.name;
      setTimeout(tick, 55 + i * i * 0.45);   // slows down toward the end
    };
    tick();
  });

  $("clearAll").addEventListener("click", () => {
    if (!players.length) return;
    if (confirm("Remove everyone from the scoreboard? This can't be undone.")) {
      players = []; flashId = null; save(); $("drawName").textContent = "—"; $("drawName").classList.remove("win"); render();
    }
  });

  renderPick(); render();
})();
</script>
</body>
</html>
